# Install in /etc/nginx/conf.d/ (http context). No URI/query/IP/headers/body.
map $request_method $remoire_safe_method {
    default OTHER;
    GET GET;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    HEAD HEAD;
    OPTIONS OPTIONS;
}
log_format remoire_privacy '$time_iso8601 method=$remoire_safe_method status=$status duration=$request_time';
limit_req_zone $binary_remote_addr zone=remoire_oauth:1m rate=30r/m;
map $uri $remoire_form_action {
    default "'self'";
    /oauth/consent "'self' https://chatgpt.com https://chat.openai.com";
}
